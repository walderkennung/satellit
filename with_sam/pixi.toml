[workspace]
authors = ["Mose Schmiedel <mose@schmiednet.de>"]
channels = ["https://conda.modular.com/max-nightly", "conda-forge"]
name = "satellit_sam"
platforms = ["osx-arm64", "linux-64"]
version = "0.1.0"

[tasks]

[dependencies]
ipykernel = ">=7.1.0,<8"
tqdm = ">=4.67.1,<5"
requests = ">=2.32.5,<3"
pycocotools = ">=2.0.10,<3"
matplotlib = ">=3.10.8,<4"
onnxruntime = ">=1.22.0,<2"
onnx = ">=1.19.1,<2"
opencv = ">=4.12.0,<5"
numpy = ">=2.3.5,<3"
pip = ">=25.3,<26"

[pypi-dependencies]
python-base = { git = "https://github.com/walderkennung/python-base.git" }
segment_anything = { git = "https://github.com/facebookresearch/segment-anything.git" }

# CPU feature for macOS and non-CUDA systems
[feature.cpu.dependencies]
pytorch-cpu = "*"
torchvision = "*"

# GPU/CUDA feature for Linux with CUDA support
[feature.cuda]
platforms = ["linux-64"]

[feature.cuda.system-requirements]
cuda = "12.0"

[feature.cuda.dependencies]
pytorch-gpu = "*"
torchvision = "*"
cuda-version = "12.*"

[feature.cuda.activation]
scripts = ["scripts/cuda_activation.sh"]

[environments]
default = ["cpu"]
cuda = ["cuda"]
