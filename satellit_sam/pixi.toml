[workspace]
name = "satellit_sam"
authors = ["Mose Schmiedel <mose@schmiednet.de>"]
channels = ["https://conda.modular.com/max-nightly", "conda-forge"]
platforms = ["osx-arm64", "linux-64"]

[tasks]
satellit = "python -m satellit_sam.main"
sam-download = "python scripts/download_sam.py"
sam-test = "python scripts/test_sam.py"
test = "pytest tests/ -v --cov=satellit_sam --cov-report=term-missing"
docstring-coverage = "python scripts/docstring_coverage.py"

[dependencies]
ipykernel = ">=7.2.0,<8"
tqdm = ">=4.67.3,<5"
requests = ">=2.32.5,<3"
pycocotools = ">=2.0.11,<3"
matplotlib = ">=3.10.8,<4"
onnxruntime = ">=1.22.2,<2"
onnx = ">=1.20.0,<2"
opencv = ">=4.13.0,<5"
numpy = ">=2.4.2,<3"
pip = ">=26.0.1,<27"
ultralytics = ">=8.4.14,<9"
pytest = ">=9.0.2,<10"
pytest-cov = ">=7.0.0,<8"
scikit-image = ">=0.24.0,<0.25"
supervision = ">=0.25.1,<0.26"
typer = ">=0.23.0,<0.24"
laspy = ">=2.7.0,<3"
gdal = ">=3.12.2,<4"
pyproj = ">=3.7.2,<4"
ruff = ">=0.14.0,<0.15"
pyyaml = ">=6.0.3,<7"
transformers = ">=5.1.0,<6"

[pypi-dependencies]
python-base = { git = "https://github.com/walderkennung/python-base.git" }
satellit_sam = { path = ".", editable = true } # this package

# CPU feature for macOS and non-CUDA systems
[feature.cpu.dependencies]
pytorch-cpu = "*"
torchvision = "*"

# GPU/CUDA feature for Linux with CUDA support
[feature.cuda]
platforms = ["linux-64"]

[feature.cuda.system-requirements]
cuda = "12.0"

[feature.cuda.dependencies]
pytorch-gpu = "*"
torchvision = "*"
cuda-version = "12.*"

[feature.cuda.activation]
scripts = ["scripts/cuda_activation.sh"]

[environments]
default = ["cpu"]
cuda = ["cuda"]
